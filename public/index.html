<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordMaster</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #172033;
            background: linear-gradient(135deg, #eef4ff, #f8faff);
        }
        main {
            width: 100%;
            max-width: 720px;
            padding: 52px 36px;
            text-align: center;
            background: #fff;
            border: 1px solid #e3eaf5;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(35, 61, 105, 0.10);
        }
        h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 48px); }
        .description { margin: 0 0 24px; color: #526078; font-size: 18px; line-height: 1.6; }
        .version {
            display: inline-block;
            margin-bottom: 22px;
            padding: 8px 14px;
            color: #244d91;
            background: #edf3ff;
            border-radius: 999px;
            font-weight: 700;
        }
        .status { margin: 0; color: #68758b; font-size: 15px; }
    </style>
</head>
<body>
    <main>
        <h1>WordMaster</h1>
        <p class="description">Помощник по изучению иностранных слов: создавайте личный словарь, повторяйте слова и проверяйте свои знания.</p>
        <div class="version">Версия 0.0.1</div>
        <p class="status">Разработка продолжается</p>
    </main>
</body>
</html>
